<!-- Maestro del icono de Perletta. Los PNG de public/ salen de aquí con: node docs/diseno/generar-iconos.mjs -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="fondo" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#233a6b"/>
      <stop offset="1" stop-color="#0d1730"/>
    </radialGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#a9c6f2"/>
      <stop offset="0.45" stop-color="#6f95d0"/>
      <stop offset="1" stop-color="#3c5c94"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa3b4"/>
      <stop offset="0.4" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8b94a6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fondo)"/>
  <g id="maleta">
    <ellipse cx="256" cy="450" rx="136" ry="11" fill="#050a18" opacity="0.55"/>
    <!-- asa telescópica -->
    <rect x="205" y="82" width="18" height="76" fill="url(#metal)"/>
    <rect x="289" y="82" width="18" height="76" fill="url(#metal)"/>
    <rect x="184" y="62" width="144" height="34" rx="17" fill="#e6ebf5"/>
    <rect x="228" y="73" width="56" height="11" rx="5.5" fill="#8b94a6"/>
    <!-- ruedas -->
    <g fill="#c3cbdb">
      <circle cx="177" cy="433" r="19"/>
      <circle cx="335" cy="433" r="19"/>
    </g>
    <g fill="#26324d">
      <circle cx="177" cy="433" r="8"/>
      <circle cx="335" cy="433" r="8"/>
    </g>
    <!-- tirador lateral -->
    <rect x="364" y="214" width="22" height="80" rx="9" fill="#2b406b"/>
    <!-- cuerpo -->
    <rect x="138" y="140" width="236" height="282" rx="42" fill="url(#cuerpo)"/>
    <!-- cremallera con dientes y carro -->
    <rect x="153" y="155" width="206" height="252" rx="29" fill="none" stroke="#1c2c52" stroke-width="12"/>
    <rect x="153" y="155" width="206" height="252" rx="29" fill="none" stroke="#e6ebf5" stroke-width="7" stroke-dasharray="4 4"/>
    <rect x="347" y="196" width="24" height="26" rx="6" fill="url(#metal)"/>
    <rect x="354" y="218" width="10" height="36" rx="5" fill="url(#metal)"/>
    <!-- nervaduras: luz a la izquierda, sombra a la derecha -->
    <g fill="#c6dafa" opacity="0.65">
      <rect x="190" y="180" width="14" height="202" rx="7"/>
      <rect x="242" y="180" width="14" height="202" rx="7"/>
      <rect x="294" y="180" width="14" height="202" rx="7"/>
    </g>
    <g fill="#2f4d84" opacity="0.6">
      <rect x="204" y="180" width="14" height="202" rx="7"/>
      <rect x="256" y="180" width="14" height="202" rx="7"/>
      <rect x="308" y="180" width="14" height="202" rx="7"/>
    </g>
    <!-- etiqueta de equipaje -->
    <path d="M210 96 L196 168" stroke="#e6ebf5" stroke-width="5" fill="none"/>
    <g transform="rotate(12 192 202)">
      <rect x="168" y="162" width="48" height="76" rx="11" fill="#e0a265"/>
      <circle cx="192" cy="176" r="6" fill="#1c2c52"/>
      <rect x="178" y="194" width="28" height="30" rx="4" fill="#fbf3e6"/>
    </g>
  </g>
</svg>
